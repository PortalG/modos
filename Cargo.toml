[package]
name = "modos"
version = "0.1.0"
edition = "2024"

license = "MIT"
readme = "README.md"
authors = ["Portal (Lewie Boyce)"]
description = "Modern Mobile Operating System for Senior Project."

[dependencies.uefi]
version = "0.35" # <- uefi-graphic2 doesn't support v0.36^.
features = ["alloc", "global_allocator", "logger"]

[dependencies.no_std_time]
version = "0.16"
default-features = false

